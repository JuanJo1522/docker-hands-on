name: movie-app-ci-cd
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, "release/**", "hotfix/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-scan:
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        shell: bash
        working-directory: step4_movie-app
    steps:
      - uses: actions/checkout@v4
      - name: Run tests with coverage
        run: docker compose -f docker-compose.test.yml run --build --rm movie-tests
      - name: SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          docker run --rm --network host \
            -e SONAR_HOST_URL="$SONAR_HOST_URL" \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            -v "$GITHUB_WORKSPACE:/usr/src" \
            sonarsource/sonar-scanner-cli:12.2.0.4256_8.1.0 \
            sonar-scanner \
              -Dsonar.projectBaseDir=/usr/src/step4_movie-app \
              -Dsonar.host.url="$SONAR_HOST_URL" \
              -Dsonar.token="$SONAR_TOKEN"
      - name: Validate Compose
        run: docker compose config --quiet

  publish-and-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-scan
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        shell: bash
        working-directory: step4_movie-app
    steps:
      - uses: actions/checkout@v4
      - name: Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - name: Build, tag, and push images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose build movie-api movie-ui movie-ai
          docker compose push movie-api movie-ui movie-ai
      - name: Deploy stack on this machine
        env:
          MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose pull movie-api movie-ui movie-ai
          docker compose up -d --remove-orphans
      - name: Docker Hub logout
        if: always()
        run: docker logout

