name: movie-app-ci-cd
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, "release/**", "hotfix/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-scan:
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        shell: bash
        working-directory: step4_movie-app
    steps:
      - uses: actions/checkout@v5
      - name: Run tests with coverage
        run: docker compose -p movie-tests -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from movie-tests
      - name: Run browser end-to-end tests
        run: docker compose -p movie-e2e -f docker-compose.e2e.yml up --build --abort-on-container-exit --exit-code-from e2e
      - name: SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_DB_USERNAME: ${{ secrets.SONAR_DB_USERNAME }}
          SONAR_DB_PASSWORD: ${{ secrets.SONAR_DB_PASSWORD }}
          MONGO_ROOT_USERNAME: ci-check
          MONGO_ROOT_PASSWORD: ci-check
        run: |
          docker compose up -d sonarqube
          for attempt in $(seq 1 90); do
            if curl -fsS "$SONAR_HOST_URL/api/system/status" | grep -q 'UP'; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "SonarQube did not become ready at $SONAR_HOST_URL" >&2
              docker compose logs sonarqube sonarqube-db
              exit 1
            fi
            sleep 5
          done
          docker run --rm --network host \
            -e SONAR_HOST_URL="$SONAR_HOST_URL" \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            -v "$GITHUB_WORKSPACE:/usr/src" \
            sonarsource/sonar-scanner-cli:12.2.0.4256_8.1.0 \
            sonar-scanner \
              -Dsonar.projectBaseDir=/usr/src/step4_movie-app \
              -Dsonar.host.url="$SONAR_HOST_URL" \
              -Dsonar.token="$SONAR_TOKEN"
      - name: Stop test stacks
        if: always()
        run: |
          docker compose -p movie-tests -f docker-compose.test.yml down -v --remove-orphans
          docker compose -p movie-e2e -f docker-compose.e2e.yml down -v --remove-orphans
      - name: Validate Compose
        env:
          # Placeholders validate Compose interpolation; deploy secrets are not needed for this syntax check.
          MONGO_ROOT_USERNAME: ci-check
          MONGO_ROOT_PASSWORD: ci-check
          SONAR_DB_USERNAME: ci-check
          SONAR_DB_PASSWORD: ci-check
        run: docker compose config --quiet

  publish-and-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-scan
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        shell: bash
        working-directory: step4_movie-app
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - name: Build, tag, and push images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          MONGO_ROOT_USERNAME: ci-build
          MONGO_ROOT_PASSWORD: ci-build
          SONAR_DB_USERNAME: ci-build
          SONAR_DB_PASSWORD: ci-build
        run: |
          docker compose build movie-api movie-ui
          docker compose push movie-api movie-ui
      - name: Check whether the AI image needs publishing
        id: ai-image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          AI_IMAGE_TAG: latest
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- ai/; then
            if docker manifest inspect "$DOCKERHUB_USERNAME/movie-ai:$AI_IMAGE_TAG" >/dev/null 2>&1; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push AI image when its files change
        if: steps.ai-image.outputs.publish == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          AI_IMAGE_TAG: latest
          MONGO_ROOT_USERNAME: ci-build
          MONGO_ROOT_PASSWORD: ci-build
          SONAR_DB_USERNAME: ci-build
          SONAR_DB_PASSWORD: ci-build
        run: |
          docker compose build movie-ai
          docker compose push movie-ai
      - name: Deploy stack on this machine
        env:
          MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          SONAR_DB_USERNAME: ${{ secrets.SONAR_DB_USERNAME }}
          SONAR_DB_PASSWORD: ${{ secrets.SONAR_DB_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          AI_IMAGE_TAG: latest
        run: |
          docker compose pull movie-api movie-ui movie-ai
          docker compose up -d --remove-orphans
      - name: Docker Hub logout
        if: always()
        run: docker logout

