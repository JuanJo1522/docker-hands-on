services:
  movie-db:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - movie_data:/data/db
      - ./mongo/init.json:/docker-entrypoint-initdb.d/init.json:ro
      - ./mongo/init-movies.js:/docker-entrypoint-initdb.d/init-movies.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  movie-api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://movie-db:27017/movies_db
    depends_on:
      movie-db:
        condition: service_healthy

  movie-ui:
    build:
      context: ./frontend
    restart: unless-stopped

  nginx-proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8181:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - movie-ui
      - movie-api

volumes:
  movie_data:
